<main><h1>#827 界面预览</h1><p class="m">commit cf59f68 · <a href="https://github.com/yetone/magpie/pull/827">回到 PR</a> · 这次改动把 Aside 的「接入提供方」和「选择模型」分开：接入只注册 magpie 提供方、不再改写模型选择；Agent 行与详情面板会显示各字段的状态（图片未验证、缺少恢复记录、已保存但待下次启动、运行状态读不到等），运行状态读不到时保存模型会先问「保存供下次启动使用」，断开预览算不出来时会阻止断开并把原因写在对话框里。</p>
